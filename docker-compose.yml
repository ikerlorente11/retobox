# Despliegue de PRODUCCIÓN: build optimizado, nginx sirve la SPA en :8050.
# Al arrancar se crean las colecciones públicas (presets) si no existen; el
# resto de datos pertenece a cada cuenta o invitado.
#
# ⚠️ Bases de datos anteriores a la v2 (sin cuentas) no son compatibles: el
# backend se niega a arrancar. Haz copia y borra el volumen:
#   docker compose down -v
name: retobox

services:
  api:
    build: ./backend
    image: ghcr.io/ikerlorente11/retobox-api:latest   # built by the CI; `docker compose pull`
    environment:
      - DATABASE_PATH=/data/retobox.db
      # Client ID público de Google (login con Google), desde .env. Vacío = botón oculto.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # nginx es el único que llega a la API: su X-Real-IP es fiable (throttle de login).
      - TRUST_PROXY=1
      # Pon 1 cuando la web se sirva por HTTPS (cookie de sesión con Secure).
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
    volumes:
      - retobox-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    image: ghcr.io/ikerlorente11/retobox-web:latest
    ports:
      - "8050:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  retobox-data:
